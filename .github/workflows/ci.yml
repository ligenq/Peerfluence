name: CI

on:
  workflow_call:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Peerfluence.slnx

      - name: Build
        run: dotnet build Peerfluence.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test Peerfluence.Tests/Peerfluence.Tests.csproj --no-build --configuration Release --logger "console;verbosity=minimal" --logger "trx;LogFileName=unit-${{ matrix.os }}.trx" --results-directory TestResults

      - name: Headless UI tests
        run: dotnet test Peerfluence.HeadlessTests/Peerfluence.HeadlessTests.csproj --no-build --configuration Release --logger "console;verbosity=minimal" --logger "trx;LogFileName=headless-${{ matrix.os }}.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
