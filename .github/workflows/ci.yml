name: CI

on:
  workflow_call:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore Peerfluence.slnx

      - name: Verify formatting
        run: dotnet format Peerfluence.slnx --verify-no-changes --no-restore

      - name: Strict build
        run: dotnet build Peerfluence.slnx --no-restore --configuration Debug --warnaserror

      - name: Build
        run: dotnet build Peerfluence.slnx --no-restore --configuration Release --warnaserror

      # xunit.v3 4.0 is Microsoft.Testing.Platform only - it dropped VSTest, which is what the
      # --logger options above spoke. global.json opts `dotnet test` into MTP; everything after the
      # bare -- is passed to the test executable itself, which is where the reporting options moved.
      #
      # Not everything, though: `dotnet test` reads --results-directory itself even after the bare
      # --, and then reads the value after it as a directory to test, which it refuses. The reports
      # land in ./TestResults without being asked, which is where the upload step looks anyway.
      - name: Unit tests
        run: >
          dotnet test --project Peerfluence.Tests/Peerfluence.Tests.csproj
          --no-build
          --configuration Release
          --
          --report-trx
          --report-trx-filename unit-${{ matrix.os }}.trx

      - name: Headless UI tests
        run: >
          dotnet test --project Peerfluence.HeadlessTests/Peerfluence.HeadlessTests.csproj
          --no-build
          --configuration Release
          --
          --report-trx
          --report-trx-filename headless-${{ matrix.os }}.trx

      # Peerfluence.UiTests is built by the step above and deliberately not run here. It drives the
      # real application through Windows UI Automation, which needs an interactive desktop session,
      # and it is slower and less certain than the suites that gate a merge. Building it keeps it
      # from rotting; running it is a developer's choice. Off Windows it compiles to nothing.

      # The part no unit test reaches: that the dependency graph resolves, that every hosted service
      # starts and stops without throwing, and that settings survive a round trip on a machine that
      # has never run this before. A missing registration is invisible until something does this.
      - name: Smoke test the built application
        shell: bash
        run: |
          profile="${RUNNER_TEMP}/peerfluence-smoke"
          rm -rf "$profile"
          dotnet run --project Peerfluence/Peerfluence.csproj --configuration Release --no-build --             --smoke-test --profile "$profile"
          test -f "$profile/settings.json" || { echo "::error::the smoke test wrote no settings file"; exit 1; }
          echo "settings written to $profile/settings.json"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore Peerfluence.slnx

      - name: Build
        run: dotnet build Peerfluence.slnx --no-restore --configuration Release --warnaserror

      - name: Unit coverage
        run: >
          dotnet test --project Peerfluence.Tests/Peerfluence.Tests.csproj
          --no-build --configuration Release --
          --coverage --coverage-output-format cobertura
          --coverage-output coverage/unit.cobertura.xml

      - name: Headless coverage
        run: >
          dotnet test --project Peerfluence.HeadlessTests/Peerfluence.HeadlessTests.csproj
          --no-build --configuration Release --
          --coverage --coverage-output-format cobertura
          --coverage-output coverage/headless.cobertura.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/coverage/*.cobertura.xml
          if-no-files-found: error

  ci:
    # Branch protection requires one stable check name. Requiring every matrix expansion directly
    # makes the repository rule drift whenever a lane or operating system changes, while this gate
    # still fails unless every required job (and every member of each matrix) succeeded.
    #
    # CodeQL and dependency review are deliberately absent: they are separate workflows, so they
    # cannot be needs of a job here and have to stay required in their own right.
    name: CI
    if: ${{ always() }}
    needs:
      - test
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          TEST: ${{ needs.test.result }}
          COVERAGE: ${{ needs.coverage.result }}
        run: |
          failed=0
          for result in \
            "test=$TEST" \
            "coverage=$COVERAGE"
          do
            echo "$result"
            if [ "${result#*=}" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
